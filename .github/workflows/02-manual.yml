name: 02 - Manual
on:
  workflow_dispatch: 
    inputs:
      log_level:
        description:"Nivel de log"
        required: true
        default: "info"
        type: choice
        options:
          - debug
          - info
          - warning
          - error
    environment:
        description: "Entorno"
        type: environment
    dry_run:
        description: "Ejecutar sin aplicar cambios"
        required: false
        default: false
        type: boolean    
    reasons:
        description: "Motivo de la ejecución"
        required: false
        default: "Prueba de ejecución manual"
        type: string

        
jobs:
  manual:
    runs-on: ubuntu-24.04
    steps:
        - name: Mostrar todos los inputs
          env: 
            LOG_LEVEL: ${{inputs.log_level}}
            ENVIRONMENT: ${{inputs.environment}}
            DRY_RUN: ${{inputs.dry_run}}
            REASONS: ${{inputs.reasons}}
          run:
            echo "Nivel de log: $LOG_LEVEL"
            echo "Entorno: $ENVIRONMENT"
            echo "Dry run: $DRY_RUN"
            echo "Motivo: $REASONS"
            
        - name: Deploy (solo si no es dry run)
          if: ${{ !inputs.dry_run }}
          env: 
            ENVIRONMENT: ${{inputs.environment}}
          run: echo "Deploying to $ENVIRONMENT environment"
        - name: Solo log si es dry run
          run:
            echo "Dry run: no changes applied"


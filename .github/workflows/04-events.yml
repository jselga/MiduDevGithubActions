name: 04 - Events
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
jobs:
  inspect-event:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Mostrar evento
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Issue: ${{ github.event.issue.number }}"
          echo "Comment: ${{ github.event.comment.body }}"
      - name: Comentar como bot en GitHub Actions
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env: 
          AUTHOR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
        GH_TOKEN="$AUTHOR_TOKEN" gh issue comment "$ISSUE_NUMBER" \
          --body "Gracias por abrir el issue! Nos pondremos en contacto contigo pronto." \
          --repo "$GITHUB_REPOSITORY"


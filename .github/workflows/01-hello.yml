name: 01 - Hello
on:
  push:
    branches: [main]
jobs:
  hello:
    runs-on: ubuntu-24.04
    steps:
      - name: Saludar
        run: echo "Hola desde GitHub Actions"
      - name: Ver fecha del runner
        run: date
      - name: Ver archivos disponibles
        run: ls -la
      - name: hora del sistema
        run: date +"%T"  
      - name: espacio disco
        run: df -h
      - name: qui soc
        run: whoami
      - name: qui som
        run: cat /etc/passwd      
  repo-files:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código del repo
        uses: actions/checkout@v6
      - name: Ver archivos disponibles
        run: ls -la
